[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "marketpilot"
version = "0.1.0"
description = "Cross-market decision intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "webull-openapi-python-sdk>=2.0.14,<3",
  "requests>=2.32,<3",
  "cryptography>=42,<46",
]

[project.scripts]
marketpilot = "marketpilot.cli:main"

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "databento>=0.83,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marketpilot"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/marketpilot"]

[[tool.mypy.overrides]]
module = "requests"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dbn", "databento", "pandas"]
ignore_missing_imports = true
