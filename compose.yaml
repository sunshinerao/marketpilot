services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MARKETPILOT_ENV: development
      MARKETPILOT_AUTH_MODE: local
      MARKETPILOT_RULES_PATH: /app/config/rules-v1.toml
      MARKETPILOT_PROMOTION_CRITERIA_PATH: /app/config/promotion-criteria-v1.toml
      MARKETPILOT_CODE_VERSION: ${MARKETPILOT_CODE_VERSION:-local-unpinned}
      MARKETPILOT_AUDIT_BACKEND: sqlite
      MARKETPILOT_AUDIT_DB: /app/data/audit/marketpilot.sqlite3
    volumes:
      - marketpilot-audit:/app/data/audit
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MARKETPILOT_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  marketpilot-audit:
